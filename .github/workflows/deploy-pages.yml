name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare site files
        run: |
          version="${GITHUB_SHA::7}"
          mkdir _site
          cp index.html _site/
          cp styles.css "_site/styles-${version}.css"
          cp config.js "_site/config-${version}.js"
          cp script.js "_site/script-${version}.js"
          sed -i \
            -e "s|styles.css|styles-${version}.css|" \
            -e "s|config.js|config-${version}.js|" \
            -e "s|script.js|script-${version}.js|" \
            _site/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
